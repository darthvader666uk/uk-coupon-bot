name: Scrape Coupert (self-hosted)

# Coupert's Cloudflare accepts a residential IP but refuses GitHub's
# datacentre ranges — from a cloud runner every store is challenged and every
# retry fails, while the identical code returns codes from a home connection.
# So this one source runs on a self-hosted runner instead.
#
# It is deliberately a separate workflow rather than another job in scrape.yml:
# a job that needs a self-hosted runner sits queued indefinitely when the
# machine is off, which would hold up the merge job in the main run.
#
# The runner is a Linux one, inside WSL on the same machine, registered with
# the label `wsl` and managed by the systemd *user* unit
# `github-runner-uk-coupon-bot.service` (see ~/actions-runner). It was moved
# there from a Windows registration on 2026-09-10: installing the Windows
# runner as a service puts it in Session 0, which has no desktop, and the
# scrape needs a headful browser. WSL shares the host's residential IP, so
# Cloudflare still lets it through.
#
# The Linux runner is headless, so the scrape runs under `xvfb-run`, exactly
# as the cloud jobs in scrape.yml do.

on:
  schedule:
    - cron: '30 7 * * *'   # 07:30 UTC, after the main 06:00 cloud run
  workflow_dispatch:

# If the machine was off, don't let queued runs pile up — only the newest
# matters, since each run re-scrapes everything anyway.
concurrency:
  group: scrape-coupert
  cancel-in-progress: true

jobs:
  coupert:
    runs-on: [self-hosted, wsl]
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: scraper
        run: npm ci || npm install

      - name: Install Playwright chromium
        working-directory: scraper
        run: npx playwright install chromium

      # Runs the full pipeline for this one source: scrape, merge into the
      # database, re-clean, and write the shards. The collapse guard in
      # index.js refuses to save if the code count drops by half, so a blocked
      # or empty scrape can't wipe anything.
      - name: Scrape Coupert and merge
        working-directory: scraper
        run: xvfb-run -a node index.js --source=coupert --no-push

      - name: Commit and push changes
        run: |
          git config user.name "coupon-bot[bot]"
          git config user.email "coupon-bot[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true
          git add data/uk-coupons.json data/index.json data/stores data/dead-codes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🎟 Coupert scrape $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
